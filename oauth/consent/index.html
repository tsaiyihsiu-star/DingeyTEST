<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>宜修待辦｜AI Agent 授權測試</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17243a; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    main { width: min(100%, 480px); padding: 28px; background: white; border: 1px solid #dae2ec; border-radius: 18px; box-shadow: 0 12px 36px #17243a12; }
    h1 { font-size: 1.45rem; margin: 0 0 12px; }
    p { line-height: 1.6; }
    .badge { display: inline-block; background: #fff0ed; color: #b12d23; font-size: .8rem; font-weight: 700; padding: 5px 9px; border-radius: 8px; margin-bottom: 18px; }
    .muted { color: #59677b; font-size: .92rem; }
    dl { margin: 20px 0; padding: 16px; border-radius: 12px; background: #f4f7fb; }
    dt { font-weight: 700; margin-top: 12px; }
    dt:first-child { margin-top: 0; }
    dd { margin: 5px 0 0; overflow-wrap: anywhere; }
    ul { margin: 8px 0 0; padding-left: 22px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    button { min-height: 44px; border-radius: 10px; padding: 10px 17px; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .primary { color: white; background: #1462b8; border: 1px solid #1462b8; }
    .secondary { color: #243850; background: white; border: 1px solid #aebed0; }
    #status { min-height: 1.5em; }
    #status.error { color: #b12d23; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js" integrity="sha384-3lSoufGjgosjqp3JDr/NReX3PjMd3SlC8wJ23CWFjB6DSFNf71I0DhcRTUm9MwgO" crossorigin="anonymous" defer></script>
</head>

  <main>
    <span class="badge">test-todo 測試環境</span>
    <h1>宜修待辦 AI Agent 授權</h1>
    <p id="status" role="status" aria-live="polite">正在檢查登入與授權請求…</p>
    <section id="login" hidden>
      <p>請先使用宜修待辦的 Google 帳號登入，登入後會回到這個授權頁。</p>
      <button id="sign-in" class="primary" type="button">使用 Google 登入</button>
    </section>
    <section id="consent" hidden>
      <p>下列應用程式要求取得你在 <strong>test-todo</strong> 的授權。請確認應用程式與返回網址後再決定。</p>
      <dl>
        <dt>應用程式</dt><dd id="client-name"></dd>
        <dt>返回網址</dt><dd id="redirect-uri"></dd>
        <dt>要求的身分資訊範圍</dt><dd><ul id="scopes"></ul></dd>
      </dl>
      <p class="muted">OAuth 身分資訊範圍本身不限制資料表的讀寫權限。後續 Agent 的唯讀限制須由連接層與資料庫權限另外實施並驗證。</p>
      <div class="actions">
        <button id="approve" class="primary" type="button">同意授權</button>
        <button id="deny" class="secondary" type="button">拒絕授權</button>
      </div>
    </section>
  </main>
