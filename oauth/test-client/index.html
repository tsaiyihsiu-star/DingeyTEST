  <title>宜修待辦｜測試 OAuth 授權流程</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17243a; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    main { width: min(100%, 480px); padding: 28px; background: #fff; border: 1px solid #dae2ec; border-radius: 18px; }
    h1 { font-size: 1.35rem; }
    p { line-height: 1.6; }
    label { display: block; font-weight: 650; margin: 18px 0 8px; }
    input { width: 100%; font: inherit; padding: 12px; border: 1px solid #91a3ba; border-radius: 9px; }
    button { margin-top: 16px; min-height: 44px; border: 0; border-radius: 9px; padding: 10px 16px; background: #1462b8; color: #fff; font: inherit; font-weight: 650; }
    .badge { display: inline-block; padding: 5px 9px; background: #fff0ed; color: #a52e26; border-radius: 8px; font-weight: 700; }

    .muted { color: #59677b; font-size: .92rem; }

  <main>
    <span class="badge">test-todo 測試環境</span>
    <h1>OAuth 授權流程測試</h1>
    <p class="muted">此頁只驗證授權頁與同意／拒絕回跳。它不交換授權碼、不取得 token，也不讀取或修改待辦。</p>
    <p id="status" role="status" aria-live="polite">準備開始測試。</p>
    <label for="client-id">測試 OAuth client ID</label>
    <input id="client-id" type="text" autocomplete="off" spellcheck="false" placeholder="從 test-todo 的 OAuth Apps 複製">
    <button id="start" type="button">開始授權測試</button>
    <p class="muted">在 Supabase OAuth Apps 建立 Public client，Redirect URI 須精確填入此頁網址：<br><span id="callback-url"></span></p>
