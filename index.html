  <title>待辦事項 [測試版]</title>
  <style>
    :root {
      --primary:#007AFF; --red:#FF3B30; --green:#34C759;
      --orange:#FF9500; --gray:#8E8E93; --label:#1C1C1E;
      --bg:#F2F2F7; --card:#FFFFFF; --sep:#3A3A3C;
      --sat:env(safe-area-inset-top,59px);
      --sab:env(safe-area-inset-bottom,34px);
      --sidebar-bg:#1C1C1E;
      --cat-h:48px;
      /* v600.203 修正：程式裡多處(聯絡資料編輯、ERP匯入預覽、訊息視窗等)
         引用 var(--text)，但這個變數從來沒有被定義過——瀏覽器遇到未定義
         的 CSS 變數，顏色會不正確地往上繼承，導致這些地方的文字偏暗、
         看不清楚，不是這次無側邊欄配色新造成的問題，是原本就存在的錯字
         bug(應該要打 --label 卻打成 --text)。這裡先補上基本定義，設成
         跟 --label 一樣的預設值。實測發現：CSS 變數用 var() 引用另一個
         變數時，不會動態跟著母層(body)後續的覆寫走——--text 這裡用
         var(--label) 定義，之後即使 body 上的 --label 被無側邊欄深色/
         淺色模式改掉，--text 本身還是停在 :root 這裡算出來的舊值，不會
         跟著變。所以無側邊欄深色/淺色的範圍內，除了改 --label，也要
         明確把 --text 一起重新定義一次，不能只指望這裡的 var() 引用。*/
      --text:var(--label);
    }
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    body{
      position:fixed;inset:0;
      display:flex;flex-direction:row;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
      -webkit-font-smoothing:antialiased;
      background:var(--sidebar-bg);
      overscroll-behavior:none;
      /* v500.37: 全域關閉長壓選字＋iOS 長壓泡泡選單（整個 app UI 不被長壓誤選/誤跳選單） */
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    }
    /* v500.37: 輸入框重新開放選字與長壓選單（編輯任務/分類/搜尋/通訊資料都能選取、複製、貼上） */
    input, textarea, select, [contenteditable="true"]{
      -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
    }
    /* === 測試版視覺標示 === */
    body::before{
      content:'';
      position:fixed;inset:0;
      border:3px solid #FF3B30;
      pointer-events:none;
      z-index:99998;
    }
    body::after{
      content:'⚠ 測試版 TEST';
      position:fixed;
      top:env(safe-area-inset-top,8px);right:8px;
      background:#FF3B30;color:#fff;
      padding:3px 10px;
      font-size:11px;font-weight:700;
      border-radius:0 0 8px 8px;
      letter-spacing:0.5px;
      z-index:99999;
      pointer-events:none;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }
    #sidebar{
      width:76px;flex-shrink:0;
